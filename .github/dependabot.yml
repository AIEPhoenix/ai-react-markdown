version: 2

# This pnpm workspace has one shared root lockfile. The root npm job
# discovers workspace manifests, including packages, corpus and benchmarks.
# Keep one job so shared dependencies receive the same policy and grouping.
# Major upgrades and lint/typecheck minor upgrades are reviewed manually.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    cooldown:
      # Supply-chain defense: don't auto-PR versions that haven't existed
      # on the registry for at least this many days. Gives the community
      # time to discover and yank compromised releases before we ingest
      # them. Security updates BYPASS cooldown (so CVE fixes stay fast).
      default-days: 7
      semver-minor-days: 7
      semver-patch-days: 3
    labels:
      - dependencies
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
      - dependency-name: 'eslint'
        update-types:
          - version-update:semver-minor
      - dependency-name: '@eslint/*'
        update-types:
          - version-update:semver-minor
      - dependency-name: 'eslint-config-*'
        update-types:
          - version-update:semver-minor
      - dependency-name: 'eslint-plugin-*'
        update-types:
          - version-update:semver-minor
      - dependency-name: '@typescript-eslint/*'
        update-types:
          - version-update:semver-minor
      - dependency-name: 'typescript-eslint'
        update-types:
          - version-update:semver-minor
      - dependency-name: 'typescript'
        update-types:
          - version-update:semver-minor
      # KaTeX renderer output and its stylesheet must move together.
      # Review minor updates manually, including engine/core peer ranges.
      - dependency-name: 'katex'
        update-types:
          - version-update:semver-minor
    groups:
      # Match families before dependency-type groups: workspace consumers
      # can classify the same package as production or development.
      mantine:
        patterns:
          - '@mantine/*'
        update-types: [minor, patch]
      dev-deps:
        dependency-type: development
        update-types: [minor, patch]
      runtime-deps:
        dependency-type: production
        update-types: [minor, patch]

  # GitHub Actions used in workflows — major-block only; no lint-plugin lock needed.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - 'scope:ci'
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
