name: Verify published release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing train or independent package tag to verify (does not publish)
        required: true
        type: string
        default: v3.0.0

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v2
        with:
          runtime: node@22.23.2
          install: false
      - name: Verify actual registry artifacts
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: pnpm test:published-release "$RELEASE_TAG" "$RUNNER_TEMP/published-release"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: published-release-verification
          path: ${{ runner.temp }}/published-release
          if-no-files-found: error
