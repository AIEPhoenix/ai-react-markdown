name: Release

# Publishes both packages to npm with provenance attestation when a version
# tag is pushed. Flow:
#
#   pnpm version-packages X.Y.Z && pnpm install
#   git commit -am "chore(release): vX.Y.Z"
#   git tag vX.Y.Z && git push origin main vX.Y.Z
#
# Independent (non-lockstep) packages — e.g.
# @ai-react-markdown/remark-mark-highlight — ride a train tag automatically
# when their version was bumped (pnpm publish -r skips already-published
# versions). To release ONE of them without a train, push a package tag:
#
#   git tag remark-mark-highlight-vX.Y.Z && git push origin remark-mark-highlight-vX.Y.Z
#
# The steps below detect the tag shape: package tags verify against that
# package's package.json, publish with --filter, and use auto-generated
# release notes.
#
# Auth is npm "trusted publishing" (OIDC): this repo+workflow is registered
# as a trusted publisher for both packages on npmjs.com, so no token secret
# exists at all — npm mints a short-lived credential from the id-token
# permission below, and provenance is attached automatically. pnpm's own
# native OIDC support landed in 11.1.3, below the version pinned here, so the
# workflow-wide pnpm publishes directly — no npx side-channel.

on:
  push:
    tags:
      - 'v*'
      - '*-v*'

permissions:
  contents: write # create the GitHub release
  id-token: write # OIDC token for npm trusted publishing + provenance

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify & publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm/setup (not pnpm/action-setup, which stops at pnpm 10) installs
      # pnpm and Node in one step, taking the pnpm version from
      # `packageManager`. No registry-url equivalent is configured anywhere:
      # with trusted publishing there is no auth token, and writing an .npmrc
      # with an unresolved ${NODE_AUTH_TOKEN} placeholder would interfere with
      # the OIDC flow.
      - name: Setup pnpm + Node
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        run: |
          case "$GITHUB_REF_NAME" in
            v*)
              TAG_VERSION="${GITHUB_REF_NAME#v}"
              PKG_PATH="./package.json"
              ;;
            *-v*)
              PKG_DIR="${GITHUB_REF_NAME%-v*}"
              TAG_VERSION="${GITHUB_REF_NAME##*-v}"
              PKG_PATH="./packages/${PKG_DIR}/package.json"
              if [ ! -f "$PKG_PATH" ]; then
                echo "::error::Tag ${GITHUB_REF_NAME} names no package directory (${PKG_PATH})"
                exit 1
              fi
              # Package tags are for INDEPENDENTLY versioned packages only. A
              # lockstep package must ride the train tag (`vX.Y.Z`), where the
              # check below refuses a partial train — a `core-vX.Y.Z` tag
              # would publish one lockstep package alone and bypass it (same
              # set as LOCKSTEP in scripts/version-packages.mjs).
              case "$PKG_DIR" in
                core|engine|mantine)
                  echo "::error::packages/${PKG_DIR} is a lockstep package — release it with a train tag (v${TAG_VERSION}), not ${GITHUB_REF_NAME}"
                  exit 1
                  ;;
              esac
              ;;
          esac
          PKG_VERSION="$(node -p "require('${PKG_PATH}').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match ${PKG_PATH} version ${PKG_VERSION}"
            exit 1
          fi
          # A train tag publishes the three lockstep packages together; a
          # package left behind (hand edit, partial revert) would make
          # `pnpm publish -r` skip it silently and ship a partial train.
          if [ "$PKG_PATH" = "./package.json" ]; then
            for dir in core engine mantine; do
              V="$(node -p "require('./packages/${dir}/package.json').version")"
              if [ "$V" != "$TAG_VERSION" ]; then
                echo "::error::Lockstep package packages/${dir} is at ${V}, tag is ${TAG_VERSION}"
                exit 1
              fi
            done
            # mantine's core peer range must move with the train: a hand-
            # bumped major that leaves `^<old>` behind ships a mantine whose
            # peer is unmet on install (2026-08-19 review).
            PEER="$(node -p "require('./packages/mantine/package.json').peerDependencies['@ai-react-markdown/core']")"
            if [ "$PEER" != "^${TAG_VERSION}" ]; then
              echo "::error::packages/mantine peer @ai-react-markdown/core is '${PEER}', expected '^${TAG_VERSION}'"
              exit 1
            fi
            # The two other dependency edges that ship with the train (2026-08-19
            # review r2 P2-17):
            # - core pins engine EXACTLY (`workspace:*` → `X.Y.Z`); that promise
            #   is documented in the engine README and has no other guard —
            #   `workspace:^` would pass every other gate and widen it silently.
            CORE_ENGINE="$(node -p "require('./packages/core/package.json').dependencies['@ai-react-markdown/engine']")"
            if [ "$CORE_ENGINE" != "workspace:*" ]; then
              echo "::error::packages/core must depend on @ai-react-markdown/engine as 'workspace:*' (exact pin), found '${CORE_ENGINE}'"
              exit 1
            fi
            # - engine depends on remark-mark-highlight (its own version line)
            #   via `workspace:^`, which publish expands to `^<local version>`;
            #   that version must already exist on npm or the train's engine
            #   is uninstallable.
            RMH_VERSION="$(node -p "require('./packages/remark-mark-highlight/package.json').version")"
            if ! npm view "@ai-react-markdown/remark-mark-highlight@${RMH_VERSION}" version >/dev/null 2>&1; then
              echo "::error::@ai-react-markdown/remark-mark-highlight@${RMH_VERSION} is not on npm yet — publish it (tag remark-mark-highlight-v${RMH_VERSION}) before the train"
              exit 1
            fi
          fi

      # Full quality gate — mirrors CI so a tag can't ship anything main
      # wouldn't accept. Build runs first: mantine's typecheck/tests resolve
      # @ai-react-markdown/core through its exports map, which points at dist/.
      - name: Overrides in sync
        run: pnpm check:overrides

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      # Publish-surface gate, mirroring CI's build task: exports-map
      # resolution (attw) + manifest lint (publint) on the packed tarballs.
      - name: Package export checks (attw + publint)
        run: pnpm packcheck

      - name: Typecheck
        run: pnpm -r typecheck

      # `pnpm -r` skips the workspace root — the root script is the only
      # gate covering .storybook and packages/*/stories (same split as CI).
      - name: Typecheck (storybook + stories)
        run: pnpm typecheck

      # Per-package unit suites, matching the CI gate.
      - name: Test
        run: pnpm -r test

      # Browser smokes, matching CI's browser-smoke task: the root vitest
      # config's `storybook` project renders every story in headless Chromium.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Browser smokes (storybook stories)
        run: pnpm vitest run --project=storybook

      # pnpm delegates the actual upload to the npm CLI, and the OIDC token
      # exchange happens there — npm 10.x (bundled with Node 22) predates
      # trusted publishing and dies with ENEEDAUTH.
      - name: Upgrade npm (OIDC exchange needs ≥ 11.5.1)
        run: npm install -g npm@^11.5.1 && npm --version

      # A pre-release version (`x.y.z-beta.1` — the version script and the
      # tag filter both accept it) must not take over the `latest` dist-tag:
      # npm gives every publish `latest` unless told otherwise (2026-08-19
      # review r2 P2-16). The dist-tag is the pre-release identifier's first
      # word (`beta.1` → `beta`, `rc.2` → `rc`), `next` when it has none.
      - name: Publish to npm (OIDC trusted publishing + provenance)
        run: |
          VERSION="${GITHUB_REF_NAME##*v}"
          DIST_TAG_ARGS=()
          case "$VERSION" in
            *-*)
              PRE="${VERSION#*-}"
              PRE_ID="${PRE%%[.0-9]*}"
              DIST_TAG_ARGS=(--tag "${PRE_ID:-next}")
              echo "Pre-release ${VERSION}: publishing under dist-tag '${DIST_TAG_ARGS[1]}'"
              ;;
          esac
          case "$GITHUB_REF_NAME" in
            v*)
              pnpm publish -r --access public --no-git-checks "${DIST_TAG_ARGS[@]}"
              ;;
            *-v*)
              PKG_DIR="${GITHUB_REF_NAME%-v*}"
              pnpm publish --filter "./packages/${PKG_DIR}" --access public --no-git-checks "${DIST_TAG_ARGS[@]}"
              ;;
          esac

      # Notes come from the version's section in docs/release-highlights.md —
      # the hand-written changelog — falling back to GitHub's auto-generated
      # notes if no section exists for this version.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_NAME#v}" = "$GITHUB_REF_NAME" ]; then
            # Package tag — no release-highlights section; auto-generate notes.
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          # A `### <version>` heading followed by a space (title) or by end
          # of line; the section runs to the next `### `. If the same version
          # has more than one section, only the first is used — warn so the
          # truncation is visible in the job log rather than discovered on
          # the release page.
          SECTIONS="$(grep -cE "^### ${VERSION//./\\.}( |$)" docs/release-highlights.md || true)"
          awk -v ver="$VERSION" '
            index($0, "### " ver " ") == 1 || $0 == "### " ver { found = 1; next }
            found && /^### / { exit }
            found { print }
          ' docs/release-highlights.md > /tmp/release-notes.md
          if [ "$SECTIONS" -gt 1 ]; then
            echo "::warning::docs/release-highlights.md has ${SECTIONS} sections for ${VERSION}; only the first is used as release notes"
          fi
          if [ -s /tmp/release-notes.md ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md --verify-tag
          else
            echo "::warning::No '### ${VERSION}' section in docs/release-highlights.md — falling back to auto-generated release notes"
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
