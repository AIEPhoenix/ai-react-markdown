name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI only reads the repository; the default GITHUB_TOKEN grant is wider.
permissions:
  contents: read

# Cancel any in-progress run on the same ref when a new commit arrives.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ${{ matrix.task }} (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Pinned to the EXACT patch as determinism insurance. NOTE the v2.8.0
        # release failure this pin was written for was NOT node drift: measured
        # on a single node (22.23.1), the corpus fingerprint flips 1cf2847b ↔
        # e0f0d77a with the fuzzGenerators.ts edit in the type-7 sticky-residue fix alone. The real
        # rule lives in boundaryDiff.test.ts: any change to fuzzGenerators.ts
        # or pinnedCorpus.ts must regenerate boundaryBaseline.json in the SAME
        # commit. (node 24 does drift the fast-check stream — keep the pin.)
        node: ['22.23.2']
        task:
          - lint
          - format-check
          - typecheck
          - test
          - build
          - browser-smoke

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm/setup (not pnpm/action-setup, which stops at pnpm 10) installs
      # pnpm and the Node runtime in one step. The pnpm version comes from
      # `packageManager` in package.json; `install: false` keeps the explicit
      # frozen-lockfile step below, so a lockfile drift fails loudly here
      # rather than inside the action.
      - name: Setup pnpm + Node ${{ matrix.node }}
        uses: pnpm/setup@v2
        with:
          runtime: node@${{ matrix.node }}
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Overrides live ONLY in pnpm-workspace.yaml (pnpm 11); this asserts
      # the lockfile recorded the same rules — a stale lockfile means the
      # rules people believe are in force are not the ones that resolved
      # the tree. (A package.json#pnpm copy is rejected by the script.)
      - name: Overrides in sync
        if: matrix.task == 'lint'
        run: pnpm check:overrides

      - name: Lint
        if: matrix.task == 'lint'
        run: pnpm lint

      - name: Format check
        if: matrix.task == 'format-check'
        run: pnpm format:check

      # Workspace packages resolve each other through exports maps that point
      # at dist/ — absent on a fresh checkout since matrix tasks run in
      # isolated jobs. Build core AND its workspace dependencies (the `...`
      # suffix pulls in @ai-react-markdown/remark-mark-highlight) so
      # dependents check against the real built artifacts (what npm consumers
      # get).
      - name: Build core + its workspace deps (dependents resolve dist)
        if: matrix.task == 'typecheck' || matrix.task == 'test' || matrix.task == 'browser-smoke'
        run: pnpm --filter '@ai-react-markdown/core...' build

      - name: Typecheck (all packages)
        if: matrix.task == 'typecheck'
        run: pnpm -r typecheck

      # `pnpm -r` skips the workspace root, so the root script — the only
      # gate covering .storybook and packages/*/stories — must run
      # explicitly. It also resolves core through dist, built above.
      - name: Typecheck (storybook + stories)
        if: matrix.task == 'typecheck'
        run: pnpm typecheck

      - name: Test (all packages)
        if: matrix.task == 'test'
        run: pnpm -r test

      - name: Build (all packages)
        if: matrix.task == 'build'
        run: pnpm build

      # Publish-surface gate: attw resolves every exports-map entrypoint under
      # node10/node16/bundler rules against the packed tarball, publint lints
      # the manifest — locks the dual-format exports pattern that was
      # previously only hand-validated.
      - name: Package export checks (attw + publint)
        if: matrix.task == 'build'
        run: pnpm packcheck

      # The root vitest config's `storybook` project renders every story in
      # headless Chromium (via @storybook/addon-vitest) — the only gate that
      # exercises real browser DOM. `pnpm -r test` never reaches it because
      # the project lives at the workspace root, so it gets its own task.
      - name: Install Playwright Chromium
        if: matrix.task == 'browser-smoke'
        run: pnpm exec playwright install chromium --with-deps

      - name: Browser smokes (storybook stories)
        if: matrix.task == 'browser-smoke'
        run: pnpm vitest run --project=storybook
